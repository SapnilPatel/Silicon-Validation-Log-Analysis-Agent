[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svla-agent"
version = "0.1.0"
description = "Agentic AI debug assistant for post-silicon validation logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sapnil Patel" }]
keywords = ["silicon", "validation", "logs", "rag", "llm", "anomaly-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",        # provides sklearn.cluster.HDBSCAN
    "drain3>=0.9.11",
    "anthropic>=0.40",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "jinja2>=3.1",
    "rich>=13.0",
    "typer>=0.12",
    "sentence-transformers>=2.6",
    "chromadb>=0.5",
]

[project.optional-dependencies]
app = ["streamlit>=1.33", "pandas>=2.0", "plotly>=5.20"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
svla = "svla_agent.cli:app"

[project.urls]
Homepage = "https://github.com/Sapnil/SVLA-Agent"
Repository = "https://github.com/Sapnil/SVLA-Agent"

[tool.hatch.build.targets.wheel]
packages = ["src/svla_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["svla_agent"]

[tool.mypy]
python_version = "3.10"
packages = ["svla_agent"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["svla_agent"]
branch = true
