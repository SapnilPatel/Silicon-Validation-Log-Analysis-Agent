name: CI

on:
  push:
    branches: ["main", "log-generator"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI offline: no API key -> rule-based hypotheses, hashing embeddings.
  SVLA_OFFLINE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app,api]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests
        run: pytest --cov=svla_agent --cov-report=term-missing

      - name: End-to-end smoke (bundled sample dataset)
        run: |
          svla process --logs examples/sample_logs --labels examples/sample_labels
          svla eval --logs examples/sample_logs --labels examples/sample_labels --out reports/metrics.json
          test -f reports/metrics.json
        env:
          SVLA_REPORTS_DIR: reports
          SVLA_CHROMA_DIR: .chroma_ci

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t svla-agent:ci .
      - name: Smoke the image
        run: |
          docker run --rm svla-agent:ci svla version
          docker run --rm -e SVLA_OFFLINE=1 svla-agent:ci svla process --no-index --limit 3
